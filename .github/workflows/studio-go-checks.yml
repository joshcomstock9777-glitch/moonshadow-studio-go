name: Studio Go checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-and-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npx expo export --platform android --output-dir /tmp/studio-go-export
